<!DOCTYPE html>
<html>
<head>
    <title>Usuários Cadastrados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="container">
    <h2>Usuários</h2>
    <a href="{{ url_for('register') }}" class="btn btn-success mb-2">Novo Usuário</a>
    <a href="{{ url_for('logout') }}" class="btn btn-danger mb-2">Logout</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Telefone</th>
                <th>E-mail</th>
                <th>Usuário</th>
            </tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td>{{ u[0] }}</td>
                <td>{{ u[1] }}</td>
                <td>{{ u[2] }}</td>
                <td>{{ u[3] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
